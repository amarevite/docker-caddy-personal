name: Update Caddy, build/publish image

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  build-if-updated:
    name: Update Caddy version & Build/Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    # outputs:
    #   should-build: ${{ steps.caddy-update.outputs.should-build }}
    #   latest-version-number: ${{ steps.caddy-update.outputs.LATEST_CADDY_VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run update script
        id: caddy-update
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/scripts/caddy-update.bash"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        if: steps.caddy-update.outputs.should-build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: steps.caddy-update.outputs.should-build == 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: steps.caddy-update.outputs.should-build == 'true'

      - name: Build and push Docker image
        # id: build-and-push
        uses: docker/build-push-action@v5
        if: steps.caddy-update.outputs.should-build == 'true'
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.caddy-update.outputs.LATEST_CADDY_VERSION }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          # platforms: linux/amd64

      - name: Commit if build succeeds
        uses: EndBug/add-and-commit@v9
        if: steps.caddy-update.outputs.should-build == 'true'
        with:
          add: "Dockerfile"
          default_author: github_actor
          message: "Update Caddy to ${{ steps.caddy-update.outputs.LATEST_CADDY_VERSION }}"
